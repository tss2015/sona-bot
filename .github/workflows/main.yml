name: Miss Sona Bot - 4 Hour Rotation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

concurrency:
  group: miss-sona-bot-rotation
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 245
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_IDS: ${{ secrets.OWNER_IDS }}
      DB_PATH: "bot_data.db"
      WARN_LIMIT: "3"
      CONTENT_BAN_THRESHOLD: "2"
      CAPTCHA_TIMEOUT: "120"
      BROADCAST_COOLDOWN: "300"
      MENTION_DELAY: "3.0"
      MENTION_BATCH_SIZE: "1"
      MAX_MENTIONS: "40"
      ACTIVE_WINDOW_DAYS: "30"
      MAX_GUESSES: "30"
      OCR_LANG: "eng"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install python-telegram-bot[job-queue] pytesseract pillow python-dotenv
          fi

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$BOT_TOKEN" || {
            echo "::error::BOT_TOKEN is missing"
            exit 1
          }

      - name: Compile
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q .

      - name: Run bot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Rotation started: $(date -u)"
          timeout --signal=TERM --kill-after=30s 14100s python bot.py

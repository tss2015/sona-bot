name: Miss Sona 4-Hour Rotation Shift

on:
  schedule:
    # Runs every 4 hours (at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual start from the Actions tab

permissions:
  contents: write # Required to save and push miss_sona.db back to the repo

jobs:
  run-bot-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 250 # Safety buffer slightly above the 240-minute (4h) shift

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "python-telegram-bot[job-queue]>=20.8" Pillow pytesseract

      - name: Run Miss Sona Bot (4-Hour Shift)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DB_PATH: "miss_sona.db"
        run: |
          echo "Starting 4-hour shift for Miss Sona..."
          # Run the bot for 3 hours 55 minutes (14100s) to leave 5 mins for DB backup & handoff
          # Sends SIGINT (Ctrl+C) so PTB shuts down gracefully and closes SQLite WAL
          timeout -s SIGINT 14100s python miss_sona.py || true
          echo "Shift complete. Preparing database backup..."

      - name: Persist SQLite Database
        if: always() # Runs even if the step above timed out or exited
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Force SQLite WAL checkpoint so all data is merged into miss_sona.db
          python3 -c "import sqlite3; con=sqlite3.connect('miss_sona.db'); con.execute('PRAGMA wal_checkpoint(TRUNCATE);'); con.close()" || true
          
          git add miss_sona.db
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): backup miss_sona.db after 4h rotation shift"
            git push
          else
            echo "No database changes to commit."
          fi

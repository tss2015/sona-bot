name: Miss Sona Bot - 5 Hour Rotation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write # Needed to commit and push miss_sona.db back to the repo after each shift

concurrency:
  group: miss-sona-bot-rotation
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      DB_PATH: ${{ vars.DB_PATH || 'miss_sona.db' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "python-telegram-bot[job-queue]>=20.8" Pillow pytesseract
          fi

      - name: Validate secrets
        shell: bash
        run: |
          for name in BOT_TOKEN; do
            test -n "${!name}" || {
              echo "::error::$name is missing"
              exit 1
            }
          done

      - name: Compile
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m compileall -q .

      - name: Run bot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Rotation started: $(date -u)"
          # Runs for 4 hours 45 minutes (17100s), sending SIGINT so PTB exits cleanly before the 5h mark
          timeout --signal=INT --kill-after=30s 17100s python miss_sona.py || true

      - name: Persist SQLite database
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Merge SQLite WAL journal into the main DB file before committing
          python -c "import os, sqlite3; p=os.getenv('DB_PATH', 'miss_sona.db'); con=sqlite3.connect(p); con.execute('PRAGMA wal_checkpoint(TRUNCATE);'); con.close()" || true

          git add "$DB_PATH"
          if ! git diff --staged --quiet; then
            git commit -m "chore(db): backup $DB_PATH after 5h rotation shift"
            git push
          else
            echo "No database changes to commit."
          fi
